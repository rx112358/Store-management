<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Food Ordering - Real-time Delivery</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom styles -->
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .food-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .food-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .order-status {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="gradient-bg shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-white text-xl font-bold">🍕 FoodieExpress</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="auth-buttons" class="hidden">
                        <button id="login-btn" class="bg-white text-purple-600 px-4 py-2 rounded-lg font-medium hover:bg-gray-100 transition">
                            Login
                        </button>
                        <button id="register-btn" class="bg-purple-800 text-white px-4 py-2 rounded-lg font-medium hover:bg-purple-900 transition">
                            Sign Up
                        </button>
                    </div>
                    <div id="user-menu" class="hidden flex items-center space-x-4">
                        <span id="user-email" class="text-white"></span>
                        <button id="cart-btn" class="relative bg-white text-purple-600 p-2 rounded-lg hover:bg-gray-100 transition">
                            🛒
                            <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
                        </button>
                        <button id="orders-btn" class="bg-purple-800 text-white px-4 py-2 rounded-lg font-medium hover:bg-purple-900 transition">
                            My Orders
                        </button>
                        <button id="logout-btn" class="text-white hover:text-gray-200 transition">
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Authentication Forms -->
        <div id="auth-section" class="hidden">
            <!-- Login Form -->
            <div id="login-form" class="hidden max-w-md mx-auto bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Login</h2>
                <form id="login-form-element">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                        <input type="email" id="login-email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                        <input type="password" id="login-password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500" required>
                    </div>
                    <button type="submit" class="w-full gradient-bg text-white py-2 rounded-lg font-medium hover:opacity-90 transition">
                        Login
                    </button>
                    <p class="text-center mt-4 text-gray-600">
                        Don't have an account? 
                        <a href="#" id="show-register" class="text-purple-600 hover:underline">Sign up</a>
                    </p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="hidden max-w-md mx-auto bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Sign Up</h2>
                <form id="register-form-element">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">First Name</label>
                            <input type="text" id="register-first-name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Last Name</label>
                            <input type="text" id="register-last-name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                        <input type="email" id="register-email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                        <input type="password" id="register-password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500" required>
                    </div>
                    <button type="submit" class="w-full gradient-bg text-white py-2 rounded-lg font-medium hover:opacity-90 transition">
                        Sign Up
                    </button>
                    <p class="text-center mt-4 text-gray-600">
                        Already have an account? 
                        <a href="#" id="show-login" class="text-purple-600 hover:underline">Login</a>
                    </p>
                </form>
            </div>
        </div>

        <!-- Restaurants Section -->
        <div id="restaurants-section" class="hidden">
            <h2 class="text-3xl font-bold text-gray-800 mb-8">Choose a Restaurant</h2>
            <div id="restaurants-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Restaurant cards will be populated here -->
            </div>
        </div>

        <!-- Menu Section -->
        <div id="menu-section" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <button id="back-to-restaurants" class="text-purple-600 hover:text-purple-800 mb-2">← Back to Restaurants</button>
                    <h2 id="restaurant-name" class="text-3xl font-bold text-gray-800"></h2>
                </div>
                <div id="cart-summary" class="bg-white p-4 rounded-lg shadow-lg">
                    <div class="text-lg font-semibold">Cart Total: $<span id="cart-total">0.00</span></div>
                    <button id="checkout-btn" class="mt-2 gradient-bg text-white px-4 py-2 rounded-lg font-medium hover:opacity-90 transition disabled:opacity-50" disabled>
                        Checkout
                    </button>
                </div>
            </div>
            <div id="menu-categories">
                <!-- Menu categories will be populated here -->
            </div>
        </div>

        <!-- Orders Section -->
        <div id="orders-section" class="hidden">
            <h2 class="text-3xl font-bold text-gray-800 mb-8">My Orders</h2>
            <div id="orders-list">
                <!-- Orders will be populated here -->
            </div>
        </div>

        <!-- Order Tracking Modal -->
        <div id="order-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">Order Status</h3>
                    <button id="close-modal" class="text-gray-500 hover:text-gray-700">✕</button>
                </div>
                <div id="order-details">
                    <!-- Order details will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Configuration and App Logic -->
    <script>
        // Firebase configuration (replace with your config)
        const firebaseConfig = {
            apiKey: "your-api-key",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "your-sender-id",
            appId: "your-app-id"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Global state
        let currentUser = null;
        let currentRestaurant = null;
        let cart = [];
        let ws = null;

        // API base URL
        const API_BASE = '';

        // Authentication functions
        async function login(email, password) {
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const token = await userCredential.user.getIdToken();
                
                // Send to backend
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    showNotification('Login successful!', 'success');
                    return data;
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                showNotification(`Login failed: ${error.message}`, 'error');
                throw error;
            }
        }

        async function register(email, password, firstName, lastName) {
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        first_name: firstName,
                        last_name: lastName
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    showNotification('Registration successful! Please verify your email.', 'success');
                    return data;
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                showNotification(`Registration failed: ${error.message}`, 'error');
                throw error;
            }
        }

        // API functions
        async function apiCall(endpoint, options = {}) {
            const token = currentUser ? await currentUser.getIdToken() : null;
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            
            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'API call failed');
            }
            
            return response.json();
        }

        // WebSocket connection
        function connectWebSocket() {
            if (currentUser && !ws) {
                currentUser.getIdToken().then(token => {
                    ws = new WebSocket(`ws://localhost:8000/ws/orders/?token=${token}`);
                    
                    ws.onopen = () => {
                        console.log('WebSocket connected');
                        ws.send(JSON.stringify({ type: 'subscribe_orders' }));
                    };
                    
                    ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    };
                    
                    ws.onclose = () => {
                        console.log('WebSocket disconnected');
                        ws = null;
                    };
                });
            }
        }

        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'order_update':
                    showNotification(`Order ${data.order_id}: ${data.message}`, 'info');
                    loadOrders(); // Refresh orders
                    break;
                case 'order_created':
                    showNotification('New order created!', 'success');
                    loadOrders();
                    break;
                case 'orders_list':
                    renderOrders(data.orders);
                    break;
            }
        }

        // UI functions
        function showSection(sectionId) {
            const sections = ['auth-section', 'restaurants-section', 'menu-section', 'orders-section'];
            sections.forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');
        }

        function showNotification(message, type = 'info') {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg text-white z-50 ${
                type === 'success' ? 'bg-green-500' : 
                type === 'error' ? 'bg-red-500' : 
                'bg-blue-500'
            }`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        async function loadRestaurants() {
            try {
                const data = await apiCall('/api/restaurants');
                renderRestaurants(data.restaurants);
            } catch (error) {
                showNotification(`Failed to load restaurants: ${error.message}`, 'error');
            }
        }

        function renderRestaurants(restaurants) {
            const grid = document.getElementById('restaurants-grid');
            grid.innerHTML = '';
            
            restaurants.forEach(restaurant => {
                const card = document.createElement('div');
                card.className = 'food-card bg-white rounded-lg shadow-lg p-6 cursor-pointer';
                card.onclick = () => loadMenu(restaurant.id);
                
                card.innerHTML = `
                    <h3 class="text-xl font-bold mb-2">${restaurant.name}</h3>
                    <p class="text-gray-600 mb-4">${restaurant.description}</p>
                    <div class="flex justify-between text-sm text-gray-500">
                        <span>Delivery: $${restaurant.delivery_fee}</span>
                        <span>Min: $${restaurant.minimum_order}</span>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        async function loadMenu(restaurantId) {
            try {
                const data = await apiCall(`/api/restaurants/${restaurantId}/menu`);
                currentRestaurant = data.restaurant;
                renderMenu(data);
                showSection('menu-section');
            } catch (error) {
                showNotification(`Failed to load menu: ${error.message}`, 'error');
            }
        }

        function renderMenu(menuData) {
            document.getElementById('restaurant-name').textContent = menuData.restaurant.name;
            const categoriesDiv = document.getElementById('menu-categories');
            categoriesDiv.innerHTML = '';
            
            menuData.categories.forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'mb-8';
                
                categoryDiv.innerHTML = `
                    <h3 class="text-2xl font-bold mb-4">${category.name}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${category.products.map(product => `
                            <div class="food-card bg-white rounded-lg shadow p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="font-bold">${product.name}</h4>
                                    <span class="text-green-600 font-bold">$${product.price}</span>
                                </div>
                                <p class="text-gray-600 text-sm mb-3">${product.description}</p>
                                <button onclick="addToCart('${product.id}', '${product.name}', ${product.price})" 
                                        class="gradient-bg text-white px-4 py-2 rounded-lg font-medium hover:opacity-90 transition">
                                    Add to Cart
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                categoriesDiv.appendChild(categoryDiv);
            });
        }

        async function addToCart(productId, productName, price) {
            try {
                await apiCall('/api/cart', {
                    method: 'POST',
                    body: JSON.stringify({
                        product_id: productId,
                        quantity: 1
                    })
                });
                
                cart.push({ productId, productName, price, quantity: 1 });
                updateCartUI();
                showNotification(`${productName} added to cart!`, 'success');
            } catch (error) {
                showNotification(`Failed to add to cart: ${error.message}`, 'error');
            }
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            document.getElementById('cart-count').textContent = count;
            document.getElementById('cart-total').textContent = total.toFixed(2);
            document.getElementById('checkout-btn').disabled = count === 0;
        }

        async function loadOrders() {
            try {
                const data = await apiCall('/api/orders');
                renderOrders(data.orders);
            } catch (error) {
                showNotification(`Failed to load orders: ${error.message}`, 'error');
            }
        }

        function renderOrders(orders) {
            const ordersList = document.getElementById('orders-list');
            ordersList.innerHTML = '';
            
            if (orders.length === 0) {
                ordersList.innerHTML = '<p class="text-gray-500 text-center">No orders yet.</p>';
                return;
            }
            
            orders.forEach(order => {
                const orderDiv = document.createElement('div');
                orderDiv.className = 'bg-white rounded-lg shadow p-6 mb-4';
                
                const statusColor = {
                    'pending': 'bg-yellow-500',
                    'confirmed': 'bg-blue-500',
                    'preparing': 'bg-orange-500',
                    'ready': 'bg-purple-500',
                    'out_for_delivery': 'bg-indigo-500',
                    'delivered': 'bg-green-500',
                    'cancelled': 'bg-red-500'
                };
                
                orderDiv.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="font-bold text-lg">${order.restaurant.name}</h3>
                            <p class="text-gray-600">Order #${order.id.substring(0, 8)}</p>
                        </div>
                        <div class="text-right">
                            <span class="order-status inline-block px-3 py-1 rounded-full text-white text-sm ${statusColor[order.status]}">
                                ${order.status.replace('_', ' ').toUpperCase()}
                            </span>
                            <p class="text-lg font-bold mt-1">$${order.total_amount}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-gray-600">
                        <p>Ordered: ${new Date(order.created_at).toLocaleString()}</p>
                        ${order.estimated_delivery_time ? 
                            `<p>Estimated delivery: ${new Date(order.estimated_delivery_time).toLocaleString()}</p>` : 
                            ''
                        }
                    </div>
                `;
                
                ordersList.appendChild(orderDiv);
            });
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Auth state observer
            auth.onAuthStateChanged((user) => {
                currentUser = user;
                if (user) {
                    document.getElementById('auth-buttons').classList.add('hidden');
                    document.getElementById('user-menu').classList.remove('hidden');
                    document.getElementById('user-email').textContent = user.email;
                    connectWebSocket();
                    loadRestaurants();
                    showSection('restaurants-section');
                } else {
                    document.getElementById('auth-buttons').classList.remove('hidden');
                    document.getElementById('user-menu').classList.add('hidden');
                    if (ws) {
                        ws.close();
                        ws = null;
                    }
                    showSection('auth-section');
                    document.getElementById('login-form').classList.remove('hidden');
                }
            });

            // Form submissions
            document.getElementById('login-form-element').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                await login(email, password);
            });

            document.getElementById('register-form-element').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('register-email').value;
                const password = document.getElementById('register-password').value;
                const firstName = document.getElementById('register-first-name').value;
                const lastName = document.getElementById('register-last-name').value;
                await register(email, password, firstName, lastName);
            });

            // Navigation
            document.getElementById('login-btn').addEventListener('click', () => {
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('register-form').classList.add('hidden');
            });

            document.getElementById('register-btn').addEventListener('click', () => {
                document.getElementById('register-form').classList.remove('hidden');
                document.getElementById('login-form').classList.add('hidden');
            });

            document.getElementById('show-register').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('register-form').classList.remove('hidden');
                document.getElementById('login-form').classList.add('hidden');
            });

            document.getElementById('show-login').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('register-form').classList.add('hidden');
            });

            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.signOut();
            });

            document.getElementById('orders-btn').addEventListener('click', () => {
                loadOrders();
                showSection('orders-section');
            });

            document.getElementById('back-to-restaurants').addEventListener('click', () => {
                showSection('restaurants-section');
            });
        });
    </script>
</body>
</html>
